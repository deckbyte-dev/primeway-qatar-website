<form class="form" method="post" action="{{ form_endpoint }}" data-endpoint="{{ form_endpoint }}" novalidate>
  <div class="f-grid">
    <label class="f"><input type="text" name="name" autocomplete="name" placeholder=" " required><span>Full name</span></label>
    <label class="f"><input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder=" " required><span>Phone or WhatsApp number</span></label>
    <label class="f"><input type="email" name="email" autocomplete="email" placeholder=" "><span>Email (optional)</span></label>
    <label class="f f-sel"><select name="service"><option>Company formation</option><option>PRO services</option><option>Visa services</option><option>Document attestation</option><option>Translation</option><option>Trademark</option><option>Bank account</option><option>Company closure</option><option>Something else</option></select><span>What do you need?</span></label>
{{ form_extra }}
    <label class="f f-wide"><textarea name="message" rows="4" placeholder=" "></textarea><span>Message (optional)</span></label>
  </div>
  <input class="hp" type="text" name="website_url" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="page_url" value="">
  <div class="f-foot">
    <label class="f-check"><input type="checkbox" name="consent" required><span>I agree that Primeway may contact me about this enquiry.</span></label>
    <button class="btn btn-gold" type="submit" data-magnet><span class="btn-t">Send enquiry</span><span class="btn-i"><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></span></button>
  </div>
  <p class="f-error" role="alert" hidden></p>
</form>
