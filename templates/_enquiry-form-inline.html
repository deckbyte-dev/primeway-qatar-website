<form class="form sform" method="post" action="{{ form_endpoint }}" data-endpoint="{{ form_endpoint }}" novalidate>
  <p class="s-line">Hi Primeway, my name is <label class="i"><span class="sr-only">Full name</span><input type="text" name="name" autocomplete="name" placeholder="your full name" required></label>.</p>
  <p class="s-line">You can reach me on <label class="i"><span class="sr-only">Phone or WhatsApp number</span><input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="phone or WhatsApp" required></label>.</p>
  <p class="s-line">I would like help with <label class="i"><span class="sr-only">What do you need?</span><select name="service"><option>Company formation</option><option>PRO services</option><option>Visa services</option><option>Document attestation</option><option>Translation</option><option>Trademark</option><option>Bank account</option><option>Company closure</option><option>Something else</option></select></label>.</p>
  <p class="s-line">My email is <label class="i"><span class="sr-only">Email (optional)</span><input type="email" name="email" autocomplete="email" placeholder="email, optional"></label>.</p>
  <p class="s-line">A little about my business:<label class="i i-block"><span class="sr-only">Message (optional)</span><textarea name="message" rows="1" placeholder="optional"></textarea></label></p>
  <input class="hp" type="text" name="website_url" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="page_url" value="">
  <div class="f-foot">
    <label class="f-check"><input type="checkbox" name="consent" required><span>I agree that Primeway may contact me about this enquiry.</span></label>
    <button class="btn-pill" type="submit"><span>Send enquiry</span><i aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button>
  </div>
  <p class="f-error" role="alert" hidden></p>
</form>
