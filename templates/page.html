<html lang="en">

</head>
<body class="inner">

<main id="main">

    {{ hero_picture }}
    <div class="wrap ph-in">
      {{ crumbs }}
      <h1 class="ph-h split">{{ h1 }}</h1>
      <div class="ph-row">
        <div class="ph-lead rv">{{ lead }}</div>

{{ include:_footer.html }}
